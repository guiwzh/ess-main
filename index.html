<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 字体预加载（开发环境路径，生产环境由 Vite transformIndexHtml 动态注入） -->
    <!-- <link rel="preload" href="/src/assets/fonts/CustomFont.woff2" as="font" type="font/woff2" crossorigin /> -->
    <title>储能运维管理平台</title>
  </head>
  <body class="fonts-loading">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 字体加载完毕后移除 fonts-loading 类
      document.fonts.ready.then(function () {
        document.body.classList.remove('fonts-loading')
        document.body.classList.add('fonts-loaded')
      })
    </script>
  </body>
</html>
